[project]
name = "ghim"
version = "0.1.0"
description = "GHIM Energy Module - A recursive-dynamic energy model with KLEM production and logit technology choice"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "xarray>=2023.1",
    "pydantic>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
ghim = "ghim.run:main"

[tool.setuptools.packages.find]
include = ["ghim*"]

[tool.setuptools.package-data]
"ghim.data.external" = ["**/*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["ghim/tests"]
